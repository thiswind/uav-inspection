version: 2
updates:
  # 前端 npm 依赖：正常升级
  - package-ecosystem: "npm"
    directory: "/app/uav-inspection-ui"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 5

  # 后端基础依赖（生产镜像实际安装的集合）：正常升级
  - package-ecosystem: "pip"
    directory: "/app/uav-inspection-backend"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 5
    ignore:
      # requirements-inference.txt 是可选 AI 推理层，torch/torchvision/ultralytics
      # 必须作为整体验证过的兼容集合升级，不接受单点 bump
      - dependency-name: "torch"
      - dependency-name: "torchvision"
      - dependency-name: "ultralytics"
      - dependency-name: "lapx"
      # opencv-python 在 8+ 生产模块深度使用，主版本（5.x）需计划性迁移+全量回归
      - dependency-name: "opencv-python"
        update-types: ["version-update:semver-major"]
      # websockets 承载 2 个生产 WS 端点（视频流/遥测），主版本需计划性迁移
      - dependency-name: "websockets"
        update-types: ["version-update:semver-major"]
      # vue-router 是 SPA 主干，主版本重写需专项迁移+全页回归
      - dependency-name: "vue-router"
        update-types: ["version-update:semver-major"]
      # typescript 主版本必须与 vue-tsc 配对升级（build 链 vue-tsc -b 依赖语言核心匹配）
      - dependency-name: "typescript"
        update-types: ["version-update:semver-major"]

  # GitHub Actions（如有）：正常升级
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
