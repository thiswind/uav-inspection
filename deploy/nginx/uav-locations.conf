# 无人机巡检系统 — nginx 子路径 location 片段（include 进 80 端口 default server）
# 部署位：/etc/nginx/snippets/uav-locations.conf（勿放 conf.d/——http 层不能出现 location）
# 挂载：homework-collector-preview.conf 的 server 块内、`location /` 之前一行：
#   include /etc/nginx/snippets/uav-locations.conf;
# 原理：proxy_pass 尾斜杠剥掉 /uav/... 前缀 → 后端原生根路径部署
# WebSocket（/ws/v1/*、/api/v1/ws/*）：本机 nginx.conf 未定义 connection_upgrade map，
# 故用 if 内联设置 Upgrade/Connection 头（server 块内 if 合法）
# 回滚：删 include 行 + 本文件，nginx -s reload

location = /uav { return 301 /uav/; }

location ^~ /uav/ {
    proxy_pass http://127.0.0.1:18020/;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $http_x_forwarded_proto;
    # WebSocket 升级（病虫害 Agent/日志/遥测、热力图实时推理流）
    set $ws_upgrade "";
    if ($http_upgrade) {
        set $ws_upgrade "upgrade";
    }
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection $ws_upgrade;
    # 视频/模型上传与大文件下载
    client_max_body_size 4g;
    proxy_read_timeout 3600s;
    proxy_send_timeout 3600s;
    # 推理视频流（multipart/x-mixed-replace）关缓冲
    proxy_buffering off;
}
